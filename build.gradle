plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'com.github.spotbugs' version '6.5.12'
    id 'com.diffplug.spotless' version '8.10.3'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // CurseMaven - resolves mod jars by CurseForge project + file id.
    maven {
        name = "CurseMaven"
        url = uri("https://cursemaven.com")
        content { includeGroup("curse.maven") }
    }
    mavenCentral()

    // mob-info-common, from the org's GitHub Packages registry. Reads always
    // require auth, and GitHub answers 404 (not 401) when it is missing, so an
    // unauthenticated build fails with a message that looks like a mistyped
    // coordinate. CI injects PACKAGE_READ_TOKEN (a read:packages token - the
    // workflow GITHUB_TOKEN cannot read a package owned by another repo, and
    // publish.yml needs its own GITHUB_TOKEN for the write side); locally
    // supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/mob-info-common')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Game tests live in their own source set: they compile against main and the same
// optional mod jars, run under the gameTestServer run below, and are deliberately
// NOT part of sourceSets.main - so none of it is packaged into the released jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner: loads the game test server, runs every registered
        // @GameTest, then exits with the number of failed required tests as the exit
        // code. Never opens a window, so `gradlew runGameTestServer` is CI-safe.
        gameTestServer {
            type = "gameTestServer"
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // The gametest source set joins the mod only for the gameTestServer run,
            // so @GameTestHolder is discovered from FML's scan data.
            sourceSet(sourceSets.gametest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    // Resolved manascore core artifact; its nested module jars are extracted
    // into build/ for the compile classpath (see extractManascoreModules).
    manascoreModules
}

// Compiled-against view of the extracted manascore module jars; the file
// collection carries the task dependency, so javac always sees fresh output.
def manascoreModuleJars = files(fileTree(dir: layout.buildDirectory.dir('manascore-modules').get().asFile, include: '**/*.jar'))
manascoreModuleJars.builtBy 'extractManascoreModules'

dependencies {
    // -------------------------------------------------------------------------
    // Tensura, ManasCore and Jade: compile against the exact pack versions via
    // pinned CurseMaven coordinates - version drift is the failure mode that
    // matters. ManasCore's module jars nest inside the core artifact under
    // META-INF/jars - extracted below for compilation, never committed. All
    // three stay optional at runtime: the addon no-ops if either is missing.
    // -------------------------------------------------------------------------
    compileOnly 'curse.maven:tensura-reincarnated-643695:8793360' // tensura-neoforge-2.0.1.3
    compileOnly 'curse.maven:manascore-619025:8022425' // manascore-neoforge-4.0.0.2 (core)
    compileOnly manascoreModuleJars
    compileOnly 'curse.maven:jade-324717:8591319' // Jade-1.21.1-NeoForge-15.10.6
    // GeckoLib + SmartBrainLib: the variant-relay game tests spawn a direwolf,
    // whose hierarchy implements their interfaces, so javac needs those types
    // even though no geckolib/smartbrainlib call is made. compileOnly keeps
    // them off the published POM; both are already on the dev-run classpath.
    compileOnly 'curse.maven:geckolib-388172:8309311'
    compileOnly 'curse.maven:smartbrainlib-661293:7055149'

    // mob-info-common: the shared variant-name and analysis-gating logic, a
    // required mod (see neoforge.mods.toml) resolved from the org's GitHub
    // Packages registry. Never packaged - the library ships as its own mod.
    compileOnly "org.bitwisemadness.mobinfocommon:mob_info_common:${mob_info_common_version}"
    runtimeOnly "org.bitwisemadness.mobinfocommon:mob_info_common:${mob_info_common_version}"

    manascoreModules 'curse.maven:manascore-619025:8022425'

    // Run-time classpath for dev runs ONLY (runClient / runServer /
    // runGameTestServer). Not published. ManasCore's main jar JiJ-embeds its
    // sub-modules, which NeoForge extracts at runtime, so the core jar alone
    // is what a dev run needs.
    localRuntime 'curse.maven:tensura-reincarnated-643695:8793360'
    localRuntime 'curse.maven:manascore-619025:8022425'
    localRuntime 'curse.maven:jade-324717:8591319'
    // Tensura's own required libraries (only needed for dev runs).
    localRuntime "curse.maven:architectury-api-419699:5786327"
    localRuntime "curse.maven:geckolib-388172:8309311"
    localRuntime "curse.maven:smartbrainlib-661293:7055149"
    localRuntime "curse.maven:terrablender-neoforge-940057:6054947"
}

// Extract manascore's nested module jars - byte-identical to the retired
// libs/ copies - into build/ so javac sees the module APIs (StorageHolder and
// friends). Derived entirely from the resolved Maven artifact.
tasks.register('extractManascoreModules', Sync) {
    from { zipTree(configurations.manascoreModules.singleFile) }
    include 'META-INF/jars/*.jar'
    into layout.buildDirectory.dir('manascore-modules')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mob_info_common_version: mob_info_common_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-jade')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// --- JUnit wiring (junit CI check) -------------------------------------------

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
